<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users · Alex311 prototype</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg:#f6f7f9; --panel:#fff; --ink:#1c2733; --muted:#5c6675; --border:#e2e8f0;
    --accent:#1d4ed8; --bad:#b91c1c; --badbg:#fef2f2; --ok:#047857; --okbg:#ecfdf5;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.55 -apple-system,"Segoe UI",Roboto,sans-serif; }
  /* The site bar, identical to the dashboard's and the form's. */
  header { display:flex; align-items:baseline; gap:16px; padding:14px 20px;
           background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  header .mark { height:26px; width:26px; align-self:center; }
  header h1 { font-size:18px; margin:0; }
  header .sub { color:var(--muted); font-size:12px; }
  nav.tabs { display:flex; gap:2px; margin-left:22px; align-self:stretch; }
  nav.tabs .tab-link { display:flex; align-items:center; gap:6px; text-decoration:none;
                       font-size:14px; padding:6px 16px 8px; color:var(--muted);
                       border-bottom:2px solid transparent; }
  nav.tabs .tab-link:hover { color:var(--ink); border-bottom-color:var(--border); }
  nav.tabs .tab-link[aria-current="page"] { color:var(--accent); font-weight:600;
                                            border-bottom-color:var(--accent); }
  .tab-tag { font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
             background:#dbeafe; color:var(--accent); padding:1px 6px; border-radius:99px; }
  @media (max-width:640px) {
    header { gap:2px 10px; padding:8px 14px 0; }
    header h1 { font-size:16px; }
    header .sub { flex-basis:100%; font-size:11px; }
    nav.tabs { margin-left:0; width:100%; order:3; margin-top:2px; }
    nav.tabs .tab-link { flex:1; padding:8px 4px; justify-content:center; text-align:center; }
    .tab-tag { display:none; }
    header .who { order:2; }
  }
  header .who { margin-left:auto; color:var(--muted); font-size:13px; }
  .page-title { font-size:17px; margin:0 0 14px; }
  a { color:var(--accent); }
  .wrap { max-width:900px; margin:0 auto; padding:20px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px;
          padding:18px 20px; margin-bottom:16px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em;
             color:var(--muted); margin:0 0 12px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  label { display:block; font-size:11px; font-weight:600; color:var(--muted);
          text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
  input, select { padding:9px 11px; border:1px solid var(--border); border-radius:8px;
                  font:inherit; background:#fff; }
  input { min-width:240px; flex:1; }
  button { padding:9px 14px; border:1px solid var(--border); border-radius:8px;
           background:#fff; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  button.primary:hover { background:#1740ad; color:#fff; }
  button.danger:hover { border-color:var(--bad); color:var(--bad); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:10px 12px; border-top:1px solid var(--border); }
  th { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
       border-top:none; white-space:nowrap; }
  td.actions { text-align:right; white-space:nowrap; }
  td.actions button { padding:5px 10px; font-size:13px; margin-left:4px; }
  .pill { display:inline-block; padding:1px 9px; border-radius:99px; font-size:12px; font-weight:600; }
  .pill.admin { background:#dbeafe; color:var(--accent); }
  .pill.user  { background:#e2e8f0; color:#334155; }
  .pill.off   { background:var(--badbg); color:var(--bad); }
  .box { padding:11px 13px; border-radius:8px; font-size:13px; margin-top:12px; }
  .box.ok  { background:var(--okbg); border:1px solid #a7f3d0; color:var(--ok); }
  .box.bad { background:var(--badbg); border:1px solid #fecaca; color:var(--bad); }
  code { font:500 13px ui-monospace,"SF Mono",Menlo,monospace; background:#eef2f7;
         padding:2px 6px; border-radius:5px; }
  .hint { color:var(--muted); font-size:12px; }
  .table-wrap { overflow-x:auto; }
  @media (max-width:560px) { input { min-width:100%; } .row > * { flex:1 1 100%; } }
</style>
</head>
<body>
<header>
  <img src="/favicon.svg" alt="" class="mark">
  <h1>Alex311 Visibility</h1>
  <span class="sub">Alexandria, VA service requests — unofficial mirror</span>
  <nav class="tabs" aria-label="Views">
    <a class="tab-link" href="/">Explore</a>
    <a class="tab-link" href="/#analytics">Analytics</a>
    <a class="tab-link" href="/submit">Report an issue
      <span class="tab-tag">beta</span></a>
  </nav>
  <span class="who" id="who"></span>
</header>

<div class="wrap">
  <h2 class="page-title">Prototype users</h2>
  <div class="card">
    <h2>Add someone</h2>
    <form class="row" id="add">
      <div style="flex:1">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="them@example.com">
      </div>
      <div>
        <label for="role">Role</label>
        <select id="role">
          <option value="user">user</option>
          <option value="admin">admin</option>
        </select>
      </div>
      <button class="primary" type="submit">Create</button>
    </form>
    <p class="hint">A password is generated and shown once. There is no email sending
      here, so pass it on yourself.</p>
    <div class="box ok" id="created" hidden></div>
    <div class="box bad" id="error" hidden role="alert"></div>
  </div>

  <div class="card">
    <h2>Who has access</h2>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Email</th><th>Role</th><th>Added</th><th>Last signed in</th><th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day = v => v ? String(v).slice(0, 10) : '—';
let me = null;

function say(el, text) { el.textContent = text; el.hidden = false; }

async function api(path, opts = {}) {
  const r = await fetch('/submit/api' + path, {
    headers: {'Content-Type': 'application/json'}, ...opts});
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || `HTTP ${r.status}`);
  return body;
}

async function load() {
  const who = await api('/whoami');
  me = who.user;
  $('who').textContent = me ? `${me.email} · ${me.role}` : '';
  const {users} = await api('/users');
  $('rows').innerHTML = users.map(u => {
    const off = !!u.disabled_at;
    // An admin cannot lock themselves out, and the last admin cannot be removed:
    // there would be nobody left who could let anyone back in.
    const self = me && u.user_id === me.user_id;
    const lastAdmin = u.role === 'admin' && !off
      && users.filter(x => x.role === 'admin' && !x.disabled_at).length === 1;
    return `<tr>
      <td>${esc(u.email)}${self ? ' <span class="hint">(you)</span>' : ''}</td>
      <td><span class="pill ${off ? 'off' : u.role}">${off ? 'disabled' : esc(u.role)}</span></td>
      <td>${day(u.created_at)}</td>
      <td>${day(u.last_login_at)}</td>
      <td class="actions">
        <button data-act="reset" data-id="${u.user_id}">Reset password</button>
        ${self || lastAdmin ? '' :
          `<button class="danger" data-act="${off ? 'enable' : 'disable'}"
                   data-id="${u.user_id}">${off ? 'Enable' : 'Disable'}</button>`}
      </td></tr>`;
  }).join('');
}

$('rows').addEventListener('click', async e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  $('error').hidden = true; $('created').hidden = true;
  try {
    if (b.dataset.act === 'reset') {
      const r = await api(`/users/${b.dataset.id}/reset`, {method: 'POST'});
      say($('created'), `New password for ${r.email}: ${r.password} — shown once.`);
    } else {
      await api(`/users/${b.dataset.id}/${b.dataset.act}`, {method: 'POST'});
    }
    await load();
  } catch (err) { say($('error'), err.message); }
});

$('add').addEventListener('submit', async e => {
  e.preventDefault();
  $('error').hidden = true; $('created').hidden = true;
  try {
    const r = await api('/users', {method: 'POST', body: JSON.stringify(
      {email: $('email').value.trim(), role: $('role').value})});
    say($('created'), `Created ${r.email}. Password: ${r.password} — shown once, pass it on.`);
    $('email').value = '';
    await load();
  } catch (err) { say($('error'), err.message); }
});

load().catch(err => say($('error'), err.message));
</script>
</body>
</html>
