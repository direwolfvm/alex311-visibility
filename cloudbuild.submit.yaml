# Builds the submission worker image only. Kept separate from the dashboard
# build because this one carries a browser and the public web image must not.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.submit
      - -t
      - us-east4-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/alex311-submit:latest
      - .
images:
  - us-east4-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/alex311-submit:latest
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
